<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KRONOS update</title>
<!-- ui/update.html — the only local page in the app: the update offer.

     Everything else the app shows is kronosterminal.online. This page exists
     because an update offer must render even when the site cannot be
     reached, and because a system dialog here would be the one moment the
     installed app stopped looking like the product.

     It is driven by src/updater.rs. Two commands (install_update,
     snooze_update) and one event (update-progress). Nothing else is
     reachable from here — see capabilities/update.json. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #fff; font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; padding: 26px 28px 22px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  header img { width: 40px; height: 40px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  h1 small { display: block; font-size: 11px; font-weight: 400; color: #9a9a9a; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  #whatsnew { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #9a9a9a; margin: 0 0 8px; }
  #notes { flex: 1; overflow: auto; color: #c8c8c8; white-space: pre-wrap; font: inherit; font-size: 12px; margin: 0 0 14px; }
  #notes ul { margin: 0; padding: 0; list-style: none; }
  #notes li { position: relative; padding-left: 14px; margin-bottom: 5px; line-height: 1.45; }
  #notes li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; background: #fff; }
  #bar { height: 3px; background: #262626; margin-bottom: 14px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; transition: width .15s linear; }
  #status { font-size: 11px; color: #9a9a9a; letter-spacing: .08em; text-transform: uppercase; min-height: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 7px 16px; border-radius: 2px; cursor: pointer; }
  #install { background: #fff; color: #000; border: 1px solid #fff; }
  #later { background: transparent; color: #fff; border: 1px solid #3a3a3a; }
  button:disabled { opacity: .4; cursor: default; }
  #error { color: #e0a0a0; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <img id="mark" alt="">
    <h1>Update available<small>KRONOS <span id="version"></span></small></h1>
  </header>
  <div id="whatsnew">What's new</div>
  <div id="notes"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="status"></div>
  <div id="error"></div>
  <div class="row">
    <button id="later">Later</button>
    <button id="install">Install now</button>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("version").textContent = q.get("version") || "";
  // The release body is CHANGELOG.md's section for this version followed by
  // the two first-install notes (SmartScreen, Applications). An update
  // installs itself, so only the changelog is shown here: everything from
  // the "Windows:" line on is dropped, and so is the "KRONOS x.y.z" title
  // line the header already carries.
  (() => {
    const raw = (q.get("notes") || "").trim();
    const body = raw.split(/\n\s*Windows:\s*\n/)[0].replace(/^KRONOS\s+\S+\s*\n+/, "").trim();
    const lines = body.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const box = document.getElementById("notes");
    if (!lines.length) { box.textContent = "Improvements to the desktop app."; return; }
    const ul = document.createElement("ul");
    for (const l of lines) { const li = document.createElement("li"); li.textContent = l.replace(/^[-*\u2022]\s*/, ""); ul.appendChild(li); }
    box.appendChild(ul);
  })();
