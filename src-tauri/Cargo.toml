[package]
name = "kronos-desktop"
version = "0.1.11"
description = "KRONOS Terminal as an installed desktop app"
authors = ["KRONOS"]
edition = "2021"
publish = false

[lib]
name = "kronos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
tokio = { version = "1", features = ["time"] }
serde_json = "1"

[profile.release]
# A shell for a website has no reason to be big or slow to start.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
