# Builds the installers on GitHub's machines and attaches them to a Release.
#
# Why here and not locally: the owner's PC runs Smart App Control, which
# blocks every freshly compiled build-script binary it has not seen before —
# and Cargo produces a new one on every dependency change. macOS also has to
# be built on a Mac. So a tag push is the build, and Releases is where the
# installers live.
#
# Code-signing: none yet. SmartScreen and Gatekeeper will warn on every
# install until certificates are added.
#
# Update-signing: every release IS signed, with the Tauri updater key
# (TAURI_SIGNING_PRIVATE_KEY, a repo secret; the public half is compiled into
# tauri.conf.json). Installed apps verify that signature before installing an
# update, which is what makes auto-update safe to have. If that private key is
# ever lost, every installed app is orphaned — it can never update again.
#
# Releases are PUBLISHED, not drafts: the updater fetches
# releases/latest/download/latest.json, which only resolves to a published
# release. A tag push is therefore a release, so tag deliberately.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # One .dmg that runs on Apple Silicon and Intel.
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          releaseName: "KRONOS ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}"
          # This body is also what installed apps show as the update notes, so
          # it must read as notes, not as an installer warning.
          releaseBody: |
            KRONOS desktop ${{ github.ref_name }}. Installed apps update themselves from here.

            Windows:
            Until the app is code-signed, SmartScreen says "Windows protected your PC" on first install. Click More info, then Run anyway.

            macOS:
            On first launch, right-click KRONOS and choose Open.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
